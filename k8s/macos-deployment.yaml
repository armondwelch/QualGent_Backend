apiVersion: v1
kind: PersistentVolume
metadata:
  name: macos-restored-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard-rwo
  gcePersistentDisk:
    pdName: macos-system-restored
    fsType: ext4
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: macos-simulator
spec:
  serviceName: macos-service
  replicas: 1
  selector:
    matchLabels:
      app: macos-simulator
  template:
    metadata:
      labels:
        app: macos-simulator
    spec:
      nodeSelector:
        workload: macos
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "macos"
        effect: "NoSchedule"
      - key: "DeletionCandidateOfClusterAutoscaler"
        operator: "Exists"
        effect: "PreferNoSchedule"
      initContainers:
      - name: init-macos-files
        image: gcr.io/queueforge/docker-osx-monitor:latest
        securityContext:
          runAsUser: 0
        command: ['sh', '-c']
        args:
        - |
          if [ ! -f /persistent-data/Launch.sh ]; then
            echo "Copying base macOS files to persistent storage..."
            cp -r /home/arch/OSX-KVM/* /persistent-data/
            chown -R 1000:1000 /persistent-data/
            echo "Files copied and ownership fixed"
          fi
          if [ ! -s /persistent-data/mac_hdd_ng.img ]; then
            echo "Creating macOS disk image..."
            qemu-img create -f qcow2 /persistent-data/mac_hdd_ng.img 256G
            chown 1000:1000 /persistent-data/mac_hdd_ng.img
            echo "Disk image created"
          fi
          ls -la /persistent-data/mac_hdd_ng.img
        volumeMounts:
        - name: macos-data
          mountPath: /persistent-data
      containers:
      - name: docker-osx
        image: gcr.io/queueforge/docker-osx-monitor:latest
        ports:
        - containerPort: 10022
        - containerPort: 5999
        - containerPort: 4723
        env:
        - name: SHORTNAME
          value: "ventura"
        - name: RAM
          value: "8"
        - name: EXTRA
          value: "-vnc 0.0.0.0:99"
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        securityContext:
          privileged: true
        volumeMounts:
        - name: dev-kvm
          mountPath: /dev/kvm
        - name: macos-data
          mountPath: /home/arch/OSX-KVM
      volumes:
      - name: dev-kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
  volumeClaimTemplates:
  - metadata:
      name: macos-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard-rwo
      resources:
        requests:
          storage: 200Gi
