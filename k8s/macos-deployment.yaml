apiVersion: v1
kind: PersistentVolume
metadata:
  name: macos-restored-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  gcePersistentDisk:
    pdName: macos-system-restored
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: macos-data-macos-simulator-0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  volumeName: macos-restored-pv
